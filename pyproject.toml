[build-system]
requires = ["setuptools==81.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-manipulation"
version = "0.1.0"
description = "Mixed-control dexterous manipulation runtime"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.0",
  "PyYAML==6.0.2",
  "safetensors==0.7.0",
  "torch==2.7.0",
]

[project.optional-dependencies]
manus = [
  "dex-retargeting @ git+https://github.com/dexsuite/dex-retargeting.git@8632b2cab32e1b51ce379940c414a0f78332ff6b",
]
linker = [
  "python-can==4.6.1",
]
pedal = [
  "evdev==1.7.1",
]
camera = [
  "opencv-python-headless==4.11.0.86",
  "pyrealsense2==2.58.3.10794",
]
dev = [
  "import-linter==2.3",
  "ruff==0.9.6",
  "mypy==1.15.0",
  "fonttools==4.55.3",
  "brotli==1.1.0",
]

[project.scripts]
dex-runtime = "dex_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dex_hardware_linker = [
  "assets/calibrations/*.json",
  "assets/model/*.json",
  "assets/model/*.urdf",
  "assets/model/meshes/*.STL",
]

[tool.ruff]
target-version = "py310"
# The pre-existing code sits comfortably under 100 columns; 88 would reflow
# roughly 350 otherwise-fine lines for no readability gain.
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
  "E501",    # line length is the formatter's job
  "RUF012",  # ClassVar annotations are noise on these frozen-dataclass modules
  # Parts of the retargeting math are documented in Chinese, which uses
  # full-width punctuation. These rules exist to catch homoglyph tricks in
  # identifiers, not to police CJK prose.
  "RUF001",
  "RUF002",
  "RUF003",
  # `isinstance(x, (A, B))` is idiomatic here and the rule is deprecated
  # upstream; rewriting 25 call sites buys nothing.
  "UP038",
  # False-positives on numpy: `positions[0] + (x, 0.0, 0.0)` is element-wise
  # vector addition, and the suggested `(*base, x, 0.0, 0.0)` would silently
  # build a 6-tuple instead. See tools/openxr_hand_bridge.py::_fake_pose.
  "RUF005",
  # itertools.pairwise() in one test assertion; not worth touching a test that
  # is currently proving handoff blend continuity.
  "RUF007",
]

[tool.ruff.lint.per-file-ignores]
# The console entrypoints support both `python tools/run_console.py` and
# `python -m tools.run_console`, so a try/except import block necessarily
# precedes the remaining module-level imports.
"tools/run_console.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
  "dex_contracts",
  "dex_hardware_linker",
  "dex_runtime",
  "dex_teleop_adapters",
  "tools",
]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
# Deliberately narrow, and green rather than green-by-suppression.
# dex_contracts is the layer everything else is defined in terms of, it is
# fully annotated frozen dataclasses, and it checks clean today, so CI keeps it
# that way.
#
# Widening is follow-up work. Adding src/dex_runtime today reports 61 errors,
# concentrated in:
#   policy_session.py  23  mostly torch call-overload noise
#   policy_package.py  14  mostly untyped manifest dict indexing
#   codecs.py           5  numpy call-overload
#   handoff.py          4  Optional narrowing the state machine guarantees
#                          but mypy cannot see
#   application.py      4  same
# None of these are known live defects; they need annotations and narrowing
# asserts, which is a code change rather than a configuration change.
files = ["src/dex_contracts"]

[[tool.mypy.overrides]]
module = [
  "brotli.*",
  "can.*",
  "cv2.*",
  "dex_retargeting.*",
  "evdev.*",
  "fontTools.*",
  "pyrealsense2.*",
  "rclpy.*",
  "safetensors.*",
  "xr.*",
]
ignore_missing_imports = true
