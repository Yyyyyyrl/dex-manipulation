name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./bootstrap.sh core
      # Installed on top of the `core` profile rather than via `all`: the full
      # profile builds dex-retargeting from git and pulls the LinkerHand SDK,
      # neither of which the static checks need.
      - run: >
          .venv/bin/pip install
          "import-linter==2.3"
          "ruff==0.9.6"
          "mypy==1.15.0"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      - run: .venv/bin/lint-imports
