name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./bootstrap.sh core
      - run: .venv/bin/pip install "pytest==9.0.3" "import-linter==2.3"
      - run: .venv/bin/lint-imports
      - run: .venv/bin/pytest
